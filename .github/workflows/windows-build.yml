name: Build Ubuntu x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev

      - name: Build GGML
        run: |
          cmake -S ggml -B ggml/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ggml/build -j $(nproc)

      - name: Build qwen3-tts.cpp (Absolute Static)
        run: |
          # 1. Clean everything
          rm -rf build ggml/build
          
          # 2. Configure GGML specifically as STATIC
          cmake -S ggml -B ggml/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_OPENMP=ON

          # 3. Build GGML first
          cmake --build ggml/build --config Release -j $(nproc)

          # 4. Configure main project pointing to the STATIC ggml
          # We use -DGGML_SHARED=OFF to force the CLI to swallow the library
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_SHARED=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_DIR=$(pwd)/ggml/build
            
          # 5. Build only the CLI
          cmake --build build --target qwen3-tts-cli -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-x64
          path: build/qwen3-tts-cli
