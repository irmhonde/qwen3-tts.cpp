name: Build Ubuntu x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev

      - name: Build GGML
        run: |
          cmake -S ggml -B ggml/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ggml/build -j $(nproc)

      - name: Build qwen3-tts.cpp (Static Standalone)
        run: |
          # 1. Force a clean build directory
          rm -rf build
          
          # 2. Configure with Static Linking and OpenMP
          # We force PIC but disable Shared Libs to bundle GGML into the CLI.
          # We enable OpenMP so the CPU can use all your cores.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_OPENMP=ON \
            -DGGML_CUDA=OFF
            
          # 3. Build the CLI target specifically
          cmake --build build --target qwen3-tts-cli -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-x64
          path: build/qwen3-tts-cli
