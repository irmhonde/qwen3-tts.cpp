name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Provides a stable, single-config generator across runner changes.
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (cl, link, etc.)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure GGML (Release, CPU only)
        run: >
          cmake -S ggml -B ggml/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_OPENMP=OFF
          -D_USE_MATH_DEFINES=1

      - name: Build GGML (Release)
        run: cmake --build ggml/build --config Release -j 4

      - name: Configure qwen3-tts.cpp (Release)
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -D_USE_MATH_DEFINES=1
          -D_CRT_SECURE_NO_WARNINGS=1

      - name: Build qwen3-tts.cpp (Release)
        run: cmake --build build --config Release -j 4

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-windows-x64
          if-no-files-found: error
          path: |
            build/**/qwen3-tts-cli.exe
            build/**/*.dll
