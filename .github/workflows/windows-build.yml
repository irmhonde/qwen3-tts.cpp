name: Build Ubuntu x64 (CUDA 12)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
      - name: Install Git and Build Dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential cmake libasound2-dev libgomp1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GGML Statically (CUDA)
        run: |
          # Build GGML with CUDA support
          cmake -S ggml -B ggml/build \
            -DGGML_CUDA=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build ggml/build --config Release -j $(nproc)
          
          # Remove shared libs to force static linking
          find ggml/build -name "*.so*" -delete

      - name: Build qwen3-tts.cpp (CUDA Fat Binary)
        run: |
          # We add the CUDA library paths and explicitly link ggml-cuda
          # The -L paths help the linker find the .a files we built in the previous step
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_DIR=$(pwd)/ggml/build \
            -DCMAKE_EXE_LINKER_FLAGS="-fopenmp -static-libstdc++ -static-libgcc -L$(pwd)/ggml/build/src -lggml-cuda -lcudart -lcublas" \
            -DCMAKE_CXX_FLAGS="-fopenmp"
          
          cmake --build build --target qwen3-tts-cli -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-cuda12
          path: build/qwen3-tts-cli
