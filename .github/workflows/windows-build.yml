name: Build Ubuntu x64 (CUDA 12)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # We use the official NVIDIA development container to ensure CUDA 12.x is present
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake libasound2-dev libgomp1 git

      - name: Build GGML with CUDA
        run: |
          # 1. Build GGML with CUDA backend enabled
          # We use -DGGML_CUDA=ON to target your discrete GPU
          cmake -S ggml -B ggml/build \
            -DGGML_CUDA=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build ggml/build --config Release -j $(nproc)
          
          # Force static: remove any shared objects to ensure the engine is bundled
          find ggml/build -name "*.so*" -delete

      - name: Build qwen3-tts.cpp (CUDA Fat Binary)
        run: |
          # 2. Build the main project linking to the CUDA-enabled GGML
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_DIR=$(pwd)/ggml/build \
            -DCMAKE_EXE_LINKER_FLAGS="-fopenmp -static-libstdc++ -static-libgcc" \
            -DCMAKE_CXX_FLAGS="-fopenmp"
          
          cmake --build build --target qwen3-tts-cli -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-cuda12
          path: build/qwen3-tts-cli
