name: Build Ubuntu x64 (CUDA 12)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # We move the container definition to the job level but handle git first
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
      # Step 1: Install Git inside the container so checkout works
      - name: Install Git and Build Dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential cmake libasound2-dev libgomp1

      # Step 2: Now checkout will work because 'git' is in the PATH
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GGML Statically (CUDA)
        run: |
          # Build GGML with CUDA support
          cmake -S ggml -B ggml/build \
            -DGGML_CUDA=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build ggml/build --config Release -j $(nproc)
          
          # Force static: remove shared libs
          find ggml/build -name "*.so*" -delete

      - name: Build qwen3-tts.cpp (CUDA Fat Binary)
        run: |
          # Build the main CLI linking to the CUDA engine
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_DIR=$(pwd)/ggml/build \
            -DCMAKE_EXE_LINKER_FLAGS="-fopenmp -static-libstdc++ -static-libgcc" \
            -DCMAKE_CXX_FLAGS="-fopenmp"
          
          cmake --build build --target qwen3-tts-cli -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-cuda12
          path: build/qwen3-tts-cli
