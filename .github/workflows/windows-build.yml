name: Build Ubuntu x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev

      - name: Build GGML Statically
        run: |
          # 1. We MUST force GGML to be static so the code goes INTO the CLI
          # We also disable things we don't need to keep it simple
          cmake -S ggml -B ggml/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build ggml/build --config Release -j $(nproc)

      - name: Build qwen3-tts.cpp
        run: |
          # We add -DCMAKE_EXE_LINKER_FLAGS="-lgomp" to fix the OpenMP link error
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_DIR=$(pwd)/ggml/build \
            -DCMAKE_EXE_LINKER_FLAGS="-lgomp"
          
          # Build only the CLI target
          cmake --build build --target qwen3-tts-cli -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-x64
          path: build/qwen3-tts-cli
