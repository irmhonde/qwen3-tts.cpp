name: Build Ubuntu x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libgomp1

      - name: Build GGML (Static)
        run: |
          # Build GGML as a static library first
          cmake -S ggml -B ggml/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build ggml/build --config Release -j $(nproc)
          
          # Clean out shared libs to prevent accidental dynamic linking
          find ggml/build -name "*.so*" -delete

      - name: Build qwen3-tts.cpp (Fat Binary)
        run: |
          # We force the linker to search specifically for the static archives (.a)
          # and include OpenMP for the CPU backend initialization.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DGGML_DIR=$(pwd)/ggml/build \
            -DCMAKE_EXE_LINKER_FLAGS="-fopenmp -static-libstdc++ -static-libgcc" \
            -DCMAKE_CXX_FLAGS="-fopenmp"
          
          # We build the CLI. This step should now pull in the heavy GGML objects.
          cmake --build build --target qwen3-tts-cli -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-x64
          path: build/qwen3-tts-cli
