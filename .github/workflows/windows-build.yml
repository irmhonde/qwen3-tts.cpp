name: Build Ubuntu x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev

      - name: Build GGML
        run: |
          cmake -S ggml -B ggml/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ggml/build -j $(nproc)

      - name: Build qwen3-tts.cpp (CLI Only)
        run: |
          # We disable shared libs to avoid the fPIC linking error
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build -j $(nproc)

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-ubuntu-x64
          path: build/qwen3-tts-cli
